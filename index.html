<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BipDuel — Two-Player Biplane Dogfight in Your Browser</title>
  <meta name="description" content="Two-player hotseat biplane dogfight in the browser — a tribute to Amiga Dogfight." />
  <meta name="author" content="Oleksandr Kalinkin" />
  <!-- превью ссылок; картинку рисует pixel-art/og/build.py. Адреса абсолютные: мессенджеры относительных не понимают -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bipduel.shamahan.com/" />
  <meta property="og:site_name" content="BipDuel" />
  <meta property="og:title" content="BipDuel — Two-Player Biplane Dogfight in Your Browser" />
  <meta property="og:description" content="Two-player hotseat biplane dogfight in the browser — a tribute to Amiga Dogfight." />
  <meta property="og:image" content="https://bipduel.shamahan.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Red and blue pixel-art biplanes dogfighting over an airfield under the BipDuel title" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- статистика посещений: GoatCounter без cookie; с localhost и из локальной сети скрипт сам не считает -->
  <script data-goatcounter="https://shamahan.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <!-- из спрайта самолёта: pixel-art/favicon/build.py, у каждого размера свой точный битмап -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    /* ширина поля 4:3; в сенсорном режиме по бокам остаётся не меньше --pad-min под кнопки игроков */
    :root { color-scheme: dark; --vh: 1vh; --pad-min: 0px; --stage-w: min(100vw - 2 * var(--pad-min), 133 * var(--vh), 1200px); }
    /* dvh — высота видимой части: в мобильном Safari 100vh считается без панели браузера, и низ поля уходил под неё */
    @supports (height: 1dvh) { :root { --vh: 1dvh; } }
    :root[data-input="touch"] { --pad-min: 96px; }
    body { margin: 0; background: #10141c; display: grid; place-items: center; min-height: calc(100 * var(--vh)); touch-action: manipulation; }
    /* 1cqw = 8 px канваса 800x600: панель поверх канваса масштабируется вместе с ним */
    #stage { position: relative; width: var(--stage-w); container-type: inline-size; }
    /* на сенсорном экране поле не прокручивается и не масштабируется пальцами */
    :root[data-input="touch"] #stage { touch-action: none; }
    canvas { display: block; width: 100%; image-rendering: pixelated; }
    #mute { position: fixed; top: 8px; right: 8px; font: 14px monospace; background: #222a38; color: #cdd6e4; border: 1px solid #445; padding: 4px 10px; cursor: pointer; }
    /* поделиться: низ меню, под подсказками, ряд иконок по центру (16x16 ×2 = y 532..564 канваса) */
    #share { position: absolute; left: 0; right: 0; bottom: 4.5cqw; display: flex; justify-content: center; }
    #share[hidden] { display: none; }
    .share-icons { display: flex; gap: 1cqw; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .share-btn { width: 4cqw; height: 4cqw; padding: 0; border: 0; cursor: pointer; background: var(--icons) calc(var(--frame) * -4cqw) 0 / calc(var(--frames) * 4cqw) 4cqw; image-rendering: pixelated; }
    .share-btn:hover { transform: translateY(-0.25cqw); }
    .share-btn:focus-visible { outline: 0.25cqw solid #fff3a0; outline-offset: 0.25cqw; }
    /* зоны касания строк меню (src/app/menu-hit.ts); сам контейнер клики пропускает — к ряду «поделиться» */
    #menu-hit { position: absolute; inset: 0; pointer-events: none; }
    #menu-hit[hidden] { display: none; }
    .menu-hit { position: absolute; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* кнопки паузы и конца матча на сенсорном экране (src/app/overlay-buttons.ts): по центру на y 330
       канваса, где на ПК подсказка; кегль 2cqw = TEXT_SIZE.button, высота 6.75cqw */
    #overlay-buttons { position: absolute; left: 0; right: 0; top: 37.875cqw; display: flex; justify-content: center; gap: 3cqw; }
    #overlay-buttons[hidden] { display: none; }
    .overlay-btn { font: 2cqw/1 "Press Start 2P", monospace; color: #f0f4fa; margin: 0; appearance: none; border-radius: 0; background: #222a38; border: 0.375cqw solid #f0f4fa; padding: 2cqw 3cqw; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .overlay-btn:active { background: #445; }
    /* полосы кнопок игроков (src/app/touch-pads.ts): от края экрана до поля, на всю высоту; рамки — PLAYER_COLORS */
    .pad { position: fixed; top: 0; bottom: 0; width: calc((100vw - var(--stage-w)) / 2); box-sizing: border-box; padding: 6px; display: flex; flex-direction: column; gap: 6px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .pad[hidden] { display: none; }
    #pad-p1 { left: 0; --player: #d14b4b; }
    #pad-p2 { right: 0; --player: #3b6fd1; }
    /* appearance: none — иначе iOS Safari рисует кнопку по-своему поверх фона и рамки */
    .pad-btn { flex: 1; display: grid; place-items: center; margin: 0; padding: 0; appearance: none; border-radius: 0; background: #222a38; border: 3px solid var(--player); touch-action: none; -webkit-tap-highlight-color: transparent; }
    .pad-btn.pad-pause { flex: 0 0 15%; }
    .pad-btn.pressed { background: var(--player); }
    /* знак ×3: кадр ленты touch-buttons.png по --frame; у ⏸ ×2 */
    .pad-icon { width: 48px; height: 48px; background: var(--touch-icons) calc(var(--frame) * -48px) 0 / 192px 48px; image-rendering: pixelated; pointer-events: none; }
    .pad-pause .pad-icon { width: 32px; height: 32px; background-position: calc(var(--frame) * -32px) 0; background-size: 128px 32px; }
    /* 🔊 в правом верхнем углу лёг бы на ⏸ второго игрока */
    body:has(.pad:not([hidden])) #mute { display: none; }
    /* в портрете на сенсорном экране играть нельзя: всё закрывает «Поверните телефон» (src/app/touch-mode.ts) */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; place-items: center; box-sizing: border-box; padding: 16px; background: #10141c; color: #f0f4fa; font: 16px/1.6 "Press Start 2P", monospace; text-align: center; }
    @media (orientation: portrait) { :root[data-input="touch"] #rotate { display: grid; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <nav id="share" hidden></nav>
    <div id="menu-hit" hidden></div>
    <div id="overlay-buttons" hidden></div>
  </div>
  <div id="pad-p1" class="pad" hidden></div>
  <div id="pad-p2" class="pad" hidden></div>
  <button id="mute" type="button">🔊</button>
  <div id="rotate"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
